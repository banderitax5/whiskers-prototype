<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Whiskers Pet Shop</title>
    <meta name="description" content="Find the best food for your pet based on their health profile. Whiskers provides personalized pet food recommendations for dogs, cats, and more." />
    <meta name="theme-color" content="#0b2e59" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f2137" />

    <!-- Add to Home Screen (iOS uses these instead of the manifest) -->
    <meta name="application-name" content="Whiskers" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Whiskers" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Whiskers — Personalized Pet Food Recommendations" />
    <meta property="og:description" content="Find the best food for your pet based on their health profile." />
    <meta property="og:image" content="/logo/logo-whiskers.png" />
    <meta property="og:site_name" content="Whiskers" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Whiskers — Personalized Pet Food Recommendations" />
    <meta name="twitter:description" content="Find the best food for your pet based on their health profile." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Whiskers",
      "url": "/",
      "logo": "/logo/logo-whiskers.png",
      "description": "Personalized pet food recommendations based on your pet's health profile."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
