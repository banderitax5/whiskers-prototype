server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Admin media uploads are capped at 5 MB by the API; nginx's 1 MB default
    # would reject them with 413 before the request ever reaches Node.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Content-addressed assets can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The service worker and the web app manifest must be revalidated, otherwise
    # returning visitors keep an old bundle.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Same-origin API: /api/* and /health go straight to the Node container.
    location /api/ {
        proxy_pass http://backend:4141;
        proxy_http_version 1.1;
        # helmet already sets these on API responses; sending nginx's too would
        # duplicate them with conflicting values (SAMEORIGIN + DENY).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:4141/health;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
