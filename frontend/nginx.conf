server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Directory requests make nginx emit an absolute redirect built from
    # $scheme, $host and the listen port. Behind Caddy/Cloudflare that leaked
    # the container's internal port into a public URL
    # ("301 http://whiskerspet.me:5173/login/"), which no visitor can open.
    # Relative redirects keep the scheme, host and port the browser used.
    absolute_redirect off;

    # Admin media uploads are capped at 5 MB by the API; nginx's 1 MB default
    # would reject them with 413 before the request ever reaches Node.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Security headers for the static build. Keep the CSP byte-identical to
    # deploy/Caddyfile and the dev middleware in vite.config.js
    # (backend/test/securityHeaders.test.js fails if they drift).
    #
    # static.cloudflareinsights.com / cloudflareinsights.com exist for
    # Cloudflare's edge-injected Web Analytics beacon. img-src allows Supabase
    # Storage for product/banner/media images plus data:/blob: for previews;
    # admin-pasted images from any other host are blocked by design.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cloudflareinsights.com; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Content-addressed assets can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The service worker and the web app manifest must be revalidated, otherwise
    # returning visitors keep an old bundle.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Same-origin API: /api/* and /health go straight to the Node container.
    location /api/ {
        proxy_pass http://backend:4141;
        proxy_http_version 1.1;
        # helmet already sets these on API responses; forwarding them next to
        # nginx's own copies produces two values for one header (e.g.
        # "Referrer-Policy: strict-origin-when-cross-origin,strict-origin-..."),
        # which browsers can reject as malformed. Let the server block own them.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:4141/health;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /login is not a client-side route (sign-in is a modal) and the folder of
    # the same name only holds the modal's artwork, so send the URL shoppers
    # type by hand to the home page instead of the not-found screen.
    location = /login {
        return 302 /;
    }

    # SPA fallback for client-side routes.
    #
    # Deliberately no `$uri/`: a static folder must never shadow a client
    # route. `frontend/public/login/` did exactly that - nginx answered
    # GET /login with a redirect to /login/ and then a 403, because that
    # directory has no index file. Only real files match here; everything
    # else is handed to the app.
    location / {
        try_files $uri /index.html;
    }
}
