services:
  backend:
    build:
      context: ./backend
    container_name: petconnect-backend
    env_file:
      - ./backend/.env
    ports:
      - "4141:4141"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: petconnect-frontend
    environment:
      VITE_PROXY_TARGET: http://backend:4141
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
